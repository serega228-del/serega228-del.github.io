<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foo — Fast Food Delivery</title>
  <link rel="stylesheet" href="css/style.css" >
</head>
<body>
  <div class="page">

    <header class="header">
      <div class="header__logo">
        <img src="img/logo.png" alt="Foo" class="header__logo-icon">
        Foo
      </div>

      <nav class="header__nav">
        <a href="#" class="header__nav-link">Home</a>
        <a href="#" class="header__nav-link">Menu</a>
        <a href="#" class="header__nav-link">Contact</a>
        <a href="#" class="header__nav-link">Shop</a>
      </nav>

      <div class="header__actions">
        <div class="header__search">
          <img src="img/3.png" alt="Search" class="header__search-icon">
          <input type="text" class="header__search-input" placeholder="Search">
        </div>
        <div class="header__cart">
          <a href="#">
            <img src="img/4.png" alt="Cart" class="header__cart-icon">
            <span class="header__cart-badge">2</span>
          </a>
        </div>
      </div>
    </header>

    <section class="hero">

      <div class="hero__content">
        <h1 class="hero__title">
          <span class="hero__title-word">Fast</span>
          <span class="hero__title-group">
            <span>Food</span>
            <span>Delivery</span>
          </span>
        </h1>

        <p class="hero__description">
          Sed ut perspiciatis unde omnis iste natus sit voluptatem accusantium doloremque laudantium
        </p>

        <div class="hero__actions">
          <button class="hero__button hero__button--primary">Order Now</button>

          <a href="#" class="hero__button hero__button--video">
            <span class="hero__play-icon">
              <span class="hero__play-triangle"></span>
            </span>
            Watch Video
          </a>
        </div>

        <div class="hero__rating">
          <div class="hero__stars">
            <img src="img/star.png" class="hero__star-img" alt="star">
            <img src="img/star.png" class="hero__star-img" alt="star">
            <img src="img/star.png" class="hero__star-img" alt="star">
            <img src="img/star.png" class="hero__star-img" alt="star">
            <img src="img/star.png" class="hero__star-img" alt="star">
          </div>
          <div class="hero__rating-info">
            <p class="hero__rating-text-bold">5 star rating</p>
            <p class="hero__rating-text">based on 1788 reviews</p>
          </div>
        </div>
      </div>

      <div class="hero__image">
        <img src="img/2.png" alt="food" class="hero__image-main">
      </div>

    </section>
  </div>
</body>
</html>
